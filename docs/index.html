<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middager hos oss</title>
<meta name="description" content="Ukemeny og middagsforslag for familien.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body>
<header class="topp">
  <p class="kicker" id="sesong-merke">Ukemeny</p>
  <h1>Middager hos oss</h1>
  <p class="ingress" id="uke-tekst">Forslag til uken – minst tre dager med fisk.</p>
  <div class="knapperad">
    <button type="button" class="knapp knapp--primar" id="ny-uke">Foreslå middag</button>
    <button type="button" class="knapp" id="vis-alle">Vis alle</button>
  </div>
</header>

<main>
  <section id="uke" aria-label="Ukemeny">
    <ol class="uke" id="uke-liste"></ol>
    <p class="fisk-status" id="fisk-status"></p>
  </section>

  <section id="alle" class="skjult" aria-label="Alle retter">
    <h2>Alle retter</h2>
    <div class="filtre" id="filtre"></div>
    <div class="kort-rutenett" id="alle-liste"></div>
  </section>

  <p class="feil skjult" id="feil"></p>
</main>

<footer class="bunn">
  <p>Oppskriftene ligger som tekstfiler i <code>retter/</code>. Endre en fil, kjør <code>python3 bygg.py</code> og last opp.</p>
</footer>

<dialog id="oppskrift-dialog">
  <button type="button" class="lukk" id="lukk-dialog" aria-label="Lukk">&times;</button>
  <div id="dialog-innhold"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
