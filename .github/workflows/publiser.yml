name: Publiser når en pull request er godtatt

# Startes når en pull request blir slått sammen (godtatt) inn i main.
# Bygger nettsiden på nytt og laster den opp til vness.no/middager,
# på samme måte som endre-rett.yml gjør.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publisering
  cancel-in-progress: false

jobs:
  publiser:
    # Bare når pull requesten faktisk ble slått sammen, ikke bare lukket.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bygg nettsiden
        run: python3 bygg.py

      - name: Commit hvis bygget endret docs/
        run: |
          git config user.name "vness-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            git commit -m "Bygg nettsiden på nytt"
            git push
          else
            echo "docs/ er allerede oppdatert."
          fi

      - name: Last opp til vness.no
        env:
          FTP_VERT: ${{ secrets.FTP_VERT }}
          FTP_BRUKER: ${{ secrets.FTP_BRUKER }}
          FTP_PASSORD: ${{ secrets.FTP_PASSORD }}
          FJERNMAPPE: ${{ secrets.FJERNMAPPE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u '$FTP_BRUKER','$FTP_PASSORD' '$FTP_VERT';
          mirror --reverse --delete --parallel=4 docs/ '${FJERNMAPPE:-/www/middager}';
          "

      - name: Si fra i pull requesten
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Endringene er nå publisert på https://vness.no/middager 🎉',
            });

      - name: Si fra hvis noe gikk galt
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Noe gikk galt da endringene skulle publiseres. Se loggen: ${url}`,
            });
