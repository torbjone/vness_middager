name: Ny rett fra forslag

# Startes når eieren svarer «/godkjenn» på en forslags-issue.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: retter
  cancel-in-progress: false

jobs:
  lag-rett:
    # Bare kommentarer på forslags-issues (ikke pull requests), bare fra eieren,
    # og bare når kommentaren inneholder /godkjenn.
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'ny-rett') &&
      contains(github.event.comment.body, '/godkjenn') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest

    steps:
      - name: Si fra at vi er i gang
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lagre forslaget til fil
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > forslag.md

      - name: Skriv oppskriften med Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python3 skript/lag_rett.py --issue-fil forslag.md

      - name: Bygg nettsiden
        run: |
          rm -f forslag.md
          python3 bygg.py

      - name: Commit og push
        run: |
          git config user.name "vness-bot"
          git config user.email "bot@users.noreply.github.com"
          git add retter docs
          git commit -m "Ny rett fra forslag #${{ github.event.issue.number }}"
          git push

      - name: Last opp til vness.no
        env:
          FTP_VERT: ${{ secrets.FTP_VERT }}
          FTP_BRUKER: ${{ secrets.FTP_BRUKER }}
          FTP_PASSORD: ${{ secrets.FTP_PASSORD }}
          FJERNMAPPE: ${{ secrets.FJERNMAPPE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u '$FTP_BRUKER','$FTP_PASSORD' '$FTP_VERT';
          mirror --reverse --delete --parallel=4 docs/ '${FJERNMAPPE:-/www/middager}';
          "

      - name: Lukk issuen med en hilsen
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Retten er lagt til og ligger nå på https://vness.no/middager 🎉',
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['publisert'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Si fra hvis noe gikk galt
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Noe gikk galt da retten skulle lages. Se loggen: ${url}`,
            });
